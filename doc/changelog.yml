  license:
    identifier: BSD-2-Clause
    uri: https://spdx.org/licenses/BSD-2-Clause.html
  notes: "test: BindingMapWriterTest\ndocs: Remove TODOs we solved\nfeat: A dependency collector for an event system\nfeat: Optional event dispatcher for observing the DI resolution\nfeat: Add events for BindingRegistered, DependencyCreated and DependencyResolved\ntest: LoadBindingsTest\nfeat: Consume precompiled binding map\nfeat: Support FCQNs when registering new binders\nfeat: Support resolving intersection types\nfeat: has() and get() support union types correctly now\nfix: Actually evaluate second member of a Union Type and don't fail prematurely\nfeat: Correctly handle more recent builtins and DNF with null types\nfix: Cannot \"get\" enums though has says true\nfix: \"has\" on constructor-less enums but can't get\ntest: cover union/intersection types and potential capability gaps derived from them"
